sensor:


  - platform: ble_client
    ble_client_id: lelink
    internal: true
    update_interval: never
    notify: true
    type: characteristic
    name: "lelink response"
    id: lelink_response_text
    service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "FFF1"

    lambda: |-


        handle_eml_reponse(x);
        return 0.0;


  - platform: template
    name: "Mono ODBII RPM"
    id: odbii_rpm


  - platform: template
    name: "Mono ODBII KPH"
    id: odbii_kph


  - platform: template
    name: "Mono ODBII Coolant Temperature"
    id: odbii_coolant_temp
    device_class: "temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1


  - platform: template
    name: "Mono ODBII Device Voltage"
    id: odbii_device_voltage
    device_class: "voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1



interval:
  - interval: 60s 
    then:
      - lambda: | 
          
          int uptime = 0;
          
          for (auto i : elm327_pid_status) {
              ESP_LOGD("main", "Uptime PID %d: %d", i.first, i.second);
            
              uptime = round(id(uptime_minutes).raw_state); //raw is seconds
              
              if(uptime - i.second > 60 && i.second > 60) {   //has there been no data for 30s and have we ever received data before

                switch(i.first) {
                  case 12:
                    //id(odbii_rpm).publish_state(NAN);
                    id(odbii_rpm).publish_state(0);
                  case 13:
                    id(odbii_coolant_temp).publish_state(0);
                  case 5:
                    id(odbii_kph).publish_state(0);
                }
              }
          }

      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value:  [0x41, 0x54, 0x5A,           0x0D, 0x0A, # ATZ\r\n
                    ]

      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value: [0x41, 0x54, 0x45, 0x31,     0x0D, 0x0A, # ATE1\r\n ATE0 to turn echo off
                     ]


  - interval: 10s 
    then:

      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value: [0x30, 0x31, 0x30, 0x43,      0x0D, 0x0A, # 010C --rpm
                     ]

  - interval: 11s 
    then:
      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value: [0x30, 0x31, 0x30, 0x44,      0x0D, 0x0A, # 010D --speed
                     ]

  - interval: 20s 
    then:
      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value: [0x30, 0x31, 0x30, 0x35,      0x0D, 0x0A, # 0105 --coolant
                     ]


  - interval: 14s 
    then:
      - ble_client.ble_write:
            id: lelink
            service_uuid: 0000fff0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: FFF2
            value: [0x41, 0x54, 0x52, 0x56,      0x0D, 0x0A, # ATRV --device voltage
                     ]