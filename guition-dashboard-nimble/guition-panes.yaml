---

esphome:
  name: "Nimble"
  min_version: 2026.3.0


external_components:
  - source:
      type: local
      path: esphome\custom_components
    components: [disabler]

disabler:

logger:
  level: debug

api:

#ota:
#  - platform: esphome

esp32:
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true      # P4 — replaces FETCH_INSTRUCTIONS/RODATA
      loop_task_stack_size: 16384   # tune down if stable


esp32_ble:
  max_connections: 3
  max_notifications: 48
  enable_on_boot: false
  use_psram: true

esp32_ble_tracker:
  id: ble_tracker
#  scan_parameters:
#    active: true
#    continuous: false
#    interval: 500ms
#    window: 100ms


packages:
  wifi: !include wifi.yaml
  hardware: !include guition-esp32-p4-jc1060p470.yaml


  elm327: !include elm327/elm327.yaml


debug:
  update_interval: 10s   # default is 60s


sensor:
  - platform: debug
    free:
      name: "Free Internal Heap"
      id: free_internal_heap
    block:
      name: "Largest Free Block (Internal)"
      id: largest_free_block
    min_free:
      name: "Min Free Heap (Internal)"
      id: min_free_heap
    fragmentation:
      name: "Heap Fragmentation"
      id: heap_fragmentation
    psram:
      name: "Free PSRAM"
      id: free_psram
    loop_time:
      name: "Loop Time"
      id: loop_time

  - platform: uptime
    name: "Uptime Minutes"
    id: uptime_minutes
    filters:
        - lambda: return x/60;