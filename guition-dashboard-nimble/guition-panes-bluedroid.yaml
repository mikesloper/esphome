---
# Bluedroid baseline for memory comparison — uses ESPHome esp32_ble stack.
# Build with: esphome compile guition-panes-bluedroid.yaml

esphome:
  name: "nimble"
  min_version: 2026.3.0

disabler:

logger:
  level: debug

api:

esp32:
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      loop_task_stack_size: 16384

esp32_ble:
  max_connections: 3
  max_notifications: 48
  enable_on_boot: false
  use_psram: true

esp32_ble_tracker:
  id: ble_tracker

packages:
  wifi: !include wifi-bluedroid.yaml
  hardware: !include guition-esp32-p4-jc1060p470.yaml
  elm327: !include elm327/elm327-bluedroid.yaml

debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: "Free Internal Heap"
      id: free_internal_heap
    block:
      name: "Largest Free Block (Internal)"
      id: largest_free_block
    min_free:
      name: "Min Free Heap (Internal)"
      id: min_free_heap
    fragmentation:
      name: "Heap Fragmentation"
      id: heap_fragmentation
    psram:
      name: "Free PSRAM"
      id: free_psram
    loop_time:
      name: "Loop Time"
      id: loop_time

  - platform: uptime
    name: "Uptime Minutes"
    id: uptime_minutes
    filters:
      - lambda: return x/60;
