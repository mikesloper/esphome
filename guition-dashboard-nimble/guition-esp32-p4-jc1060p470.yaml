# Guition-ESP32-P4-JC1060P470 7" Capacitive touch
#
# Hardware configuration file
---

substitutions:
  # Screen Size
  screen_height: 600
  screen_width: 1024



esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  engineering_sample: true
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
#      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      # Optional — keep only if testing proves stable:
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_SPIRAM_ALLOW_NOINIT_SEG_EXTERNAL_MEMORY: "y"
      # Remove on P4:
      # CONFIG_BTDM_CTRL_MODE_BLE_ONLY
      # CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST
      # CONFIG_SPIRAM_FETCH_INSTRUCTIONS
      # CONFIG_SPIRAM_RODATA
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true

esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true
  - channel: 4
    id: sd_card_power
    voltage: 2.7V
    adjustable: true

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

# http_request removed — was only used for C6 firmware manifest fetch, which
# crashes SDIO (sdio_rx_get_buffer) when it races WiFi/BLE on the hosted link.

# -------------------------------------------
# Network hardware
# -------------------------------------------

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 10MHz

# C6 coprocessor firmware update disabled: HTTP manifest fetch on boot races
# SDIO with WiFi/BLE and triggers sdio_rx_get_buffer asserts. Re-enable only
# when you need to update the C6 (e.g. via esptool or a quiet bench setup).
#
